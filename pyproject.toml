[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerly"
version = "0.1.0"
description = "A small corporate spend-management API with a double-entry ledger."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerly"]